<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('재고 기록')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <h2>재고 기록</h2>

        <form th:action="@{/movements/new}" th:object="${form}" method="post">
            <p th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

            <div>
                <label>상품 (옵션 조합)
                    <select th:field="*{variantId}">
                        <option value="">선택</option>
                        <option th:each="v : ${variants}" th:value="${v.id}" th:text="${v.displayName}"></option>
                    </select>
                </label>
                <p th:if="${#fields.hasErrors('variantId')}" th:errors="*{variantId}"></p>
            </div>
            <div>
                <label>채널
                    <select th:field="*{salesChannelId}">
                        <option value="">선택</option>
                        <option th:each="c : ${channels}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </label>
                <p th:if="${#fields.hasErrors('salesChannelId')}" th:errors="*{salesChannelId}"></p>
            </div>
            <div>
                <label>구분
                    <select th:field="*{type}">
                        <option value="">선택</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}"></option>
                    </select>
                </label>
                <p th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
            </div>
            <div>
                <label>수량 <input type="number" th:field="*{quantity}"></label>
                <p th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></p>
            </div>
            <div>
                <label>메모 (선택) <input type="text" th:field="*{memo}"></label>
            </div>
            <div>
                <label>교환 대상 새 상품 (교환 시에만 입력, 비우면 동일 옵션 교환)
                    <select th:field="*{newVariantId}">
                        <option value="">선택 안 함</option>
                        <option th:each="v : ${variants}" th:value="${v.id}" th:text="${v.displayName}"></option>
                    </select>
                </label>
                <p th:if="${#fields.hasErrors('newVariantId')}" th:errors="*{newVariantId}"></p>
            </div>
            <button type="submit">기록</button>
        </form>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
