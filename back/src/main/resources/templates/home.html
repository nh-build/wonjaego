<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="flex-1 container mx-auto max-w-screen-md px-4 py-16 flex flex-col items-center justify-center text-center gap-6">
        <img src="/logo.png" alt="원재고" class="w-[400px] h-auto">
        <p class="home-tagline"><span id="home-tagline-typed"></span><span class="home-tagline-cursor">|</span></p>
        <p class="text-base-content/70">여러 판매 채널의 재고를 한 곳에서 관리하세요.<br>원재고에 오신 것을 환영합니다.</p>
        <div class="flex gap-3">
            <a href="/login" class="btn btn-ghost">로그인</a>
            <a href="/signup" class="btn btn-primary">회원가입</a>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <style>
        .home-tagline {
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.25rem;
            color: #2B2B2B;
            letter-spacing: 0.05em;
            white-space: pre;
        }

        .home-tagline-cursor {
            animation: home-tagline-blink 0.8s step-end infinite;
        }

        @keyframes home-tagline-blink {
            0%, 50% { opacity: 1; }
            50.01%, 100% { opacity: 0; }
        }
    </style>
    <script th:inline="none">
        (function () {
            var TEXT = 'All your stock, in ONE';
            var TYPE_INTERVAL_MS = 70;
            var typedEl = document.getElementById('home-tagline-typed');
            if (!typedEl) {
                return;
            }

            var index = 0;
            var typeTimer = setInterval(function () {
                index += 1;
                typedEl.textContent = TEXT.slice(0, index);
                if (index >= TEXT.length) {
                    clearInterval(typeTimer);
                }
            }, TYPE_INTERVAL_MS);
        })();
    </script>
</body>
</html>
