<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' - 원재고'">원재고</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#AEDAF3">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        [data-theme="wonjaego"] {
            color-scheme: light;

            --color-base-100: #FEF7F6;
            --color-base-200: #E6F2FB;
            --color-base-300: #D3E7F5;
            --color-base-content: #33434F;

            --color-primary: #AEDAF3;
            --color-primary-content: #2F4353;

            --color-secondary: #E6F2FB;
            --color-secondary-content: #2F4353;

            --color-accent: #7FB8DE;
            --color-accent-content: #F8FCFF;

            --color-neutral: #33434F;
            --color-neutral-content: #F8FCFF;

            --color-info: #6FB1E0;
            --color-info-content: #1B2A33;

            --color-success: #86D9B9;
            --color-success-content: #123C2C;

            --color-warning: #F5D98B;
            --color-warning-content: #4A3707;

            --color-error: #F3AEB0;
            --color-error-content: #4A1113;

            --radius-selector: 1rem;
            --radius-field: 0.5rem;
            --radius-box: 1rem;

            --size-selector: 0.25rem;
            --size-field: 0.25rem;

            --border: 1px;
            --depth: 1;
            --noise: 0;
        }

        body {
            font-family: 'Pretendard', system-ui, sans-serif;
        }
    </style>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</head>
<body class="min-h-screen flex flex-col bg-base-100 text-base-content">
    <header th:fragment="appbar(title, backHref)" class="flex items-center px-4 py-4 max-w-screen-md mx-auto">
        <a th:href="@{${backHref}}" class="btn btn-ghost btn-circle" aria-label="뒤로가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <h1 class="flex-1 text-center text-lg font-bold" th:text="${title}"></h1>
        <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-ghost btn-circle" aria-label="메뉴">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </div>
            <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box shadow-sm w-40 p-2 z-10">
                <li sec:authorize="isAuthenticated()"><a href="/">홈</a></li>
                <li sec:authorize="isAuthenticated()"><a href="/products">상품</a></li>
                <li sec:authorize="isAuthenticated()"><a href="/channels">채널</a></li>
                <li sec:authorize="isAuthenticated()"><a href="/me">내 정보</a></li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="w-full text-left">로그아웃</button>
                    </form>
                </li>
                <li sec:authorize="!isAuthenticated()"><a href="/login">로그인</a></li>
                <li sec:authorize="!isAuthenticated()"><a href="/signup">회원가입</a></li>
            </ul>
        </div>
    </header>
    <footer th:fragment="footer" class="footer footer-center mt-auto p-6 text-base-content/60 text-sm">
        <p>&copy; 원재고</p>
    </footer>
</body>
</html>
