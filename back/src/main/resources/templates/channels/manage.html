<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${channel.channelType().label} + ' 관리 - 원재고'">채널 관리 - 원재고</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F7FBFE">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <style>
        :root {
            --color-bg: #F7FBFE;
            --color-card: #FFFFFF;
            --color-card-border: #E8EEF4;
            --color-tile: #E4F0FA;
            --color-accent: #D2E7F5;
            --color-button-bg: #C5E1F2;
            --color-button-text: #2B3A45;
            --color-text: #2B3A45;
            --color-text-muted: #8A97A3;
            --color-warn-text: #E29388;
            --color-warn-bg: #F7E3E0;
            --color-ok-text: #5AA06E;
            --color-ok-bg: #E3F1E8;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Pretendard', system-ui, sans-serif;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }

        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 20px 20px 40px;
        }

        .global-message {
            border-radius: 12px; padding: 12px 14px; margin: 16px 0; font-size: 0.85rem;
        }
        .global-message.error { background: var(--color-warn-bg); color: var(--color-warn-text); }
        .global-message.success { background: var(--color-ok-bg); color: var(--color-ok-text); font-weight: 600; }

        .status-card {
            margin-top: 16px; background: var(--color-card); border: 1px solid var(--color-card-border);
            border-radius: 18px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }

        .status-card-main { display: flex; align-items: center; gap: 10px; }

        .status-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--color-card-border); flex-shrink: 0; }
        .status-dot.connected { background: var(--color-ok-text); }

        .status-title { font-weight: 700; font-size: 0.95rem; }
        .status-detail { margin-top: 2px; font-size: 0.78rem; color: var(--color-text-muted); }

        .disconnect-button {
            border: none; border-radius: 999px; padding: 8px 14px; font-size: 0.82rem; font-weight: 700;
            background: var(--color-tile); color: var(--color-button-text); cursor: pointer;
        }

        h2.section-title { font-size: 0.95rem; font-weight: 700; margin: 24px 0 10px; }

        .role-toggle { display: flex; background: var(--color-tile); border-radius: 999px; padding: 4px; gap: 4px; }

        .role-toggle form { flex: 1; }

        .role-toggle-button {
            width: 100%; border: none; border-radius: 999px; padding: 12px; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; background: none; color: var(--color-text-muted);
        }

        .role-toggle-button.active { background: var(--color-button-bg); color: var(--color-button-text); }

        .role-description {
            margin-top: 10px; background: var(--color-tile); border-radius: 14px; padding: 14px 16px;
        }

        .role-description-title { font-weight: 700; font-size: 0.85rem; }
        .role-description-detail { margin-top: 3px; font-size: 0.78rem; color: var(--color-text-muted); }

        .action-row {
            display: flex; align-items: center; gap: 14px;
            border: none; width: 100%; text-align: left; border-radius: 16px; padding: 16px;
            font-family: inherit; cursor: pointer; margin-top: 10px;
        }

        .action-row.primary { background: var(--color-button-bg); color: var(--color-button-text); }
        .action-row.disabled { background: var(--color-card); border: 1px solid var(--color-card-border); color: var(--color-text); cursor: default; }

        .action-icon {
            width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,0.6);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .action-row.disabled .action-icon { background: var(--color-tile); }

        .action-body { flex: 1; min-width: 0; }
        .action-title { font-weight: 700; font-size: 0.95rem; }
        .action-detail { margin-top: 2px; font-size: 0.78rem; opacity: 0.8; }

        .action-badge {
            font-size: 0.75rem; font-weight: 700; color: var(--color-text-muted);
            background: var(--color-tile); border-radius: 999px; padding: 4px 10px; white-space: nowrap;
        }

        .role-footnote { margin: 20px 2px 0; font-size: 0.78rem; color: var(--color-text-muted); line-height: 1.6; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/layout :: appbar(${channel.channelType().label} + ' 관리', true, null, null, false)}"></div>
    <div class="page">
        <div th:if="${error}" class="global-message error" th:text="${error}"></div>
        <div th:if="${importResult != null}" class="global-message success"
             th:text="${importResult.productCount()} + '개 상품을 가져왔어요!'"></div>

        <div class="status-card">
            <div class="status-card-main">
                <span class="status-dot" th:classappend="${channel.status().name() == 'CONNECTED'} ? 'connected' : ''"></span>
                <div>
                    <p class="status-title" th:text="${channel.status().label}"></p>
                    <p th:if="${channel.connectedAt() != null}" class="status-detail"
                       th:text="${#temporals.format(channel.connectedAt(), 'yyyy-MM-dd')} + ' 연동'"></p>
                </div>
            </div>
            <form th:if="${channel.status().name() == 'CONNECTED'}" th:action="@{'/channels/' + ${channel.credentialId()} + '/disconnect'}" method="post">
                <button type="submit" class="disconnect-button">해제</button>
            </form>
        </div>

        <h2 class="section-title">채널 역할</h2>
        <div class="role-toggle">
            <form th:action="@{'/channels/' + ${channel.credentialId()} + '/role'}" method="post">
                <input type="hidden" name="role" value="PRODUCT_SOURCE">
                <button type="submit" class="role-toggle-button"
                        th:classappend="${channel.role().name() == 'PRODUCT_SOURCE'} ? 'active' : ''">상품 소스</button>
            </form>
            <form th:action="@{'/channels/' + ${channel.credentialId()} + '/role'}" method="post">
                <input type="hidden" name="role" value="ORDER_SYNC">
                <button type="submit" class="role-toggle-button"
                        th:classappend="${channel.role().name() == 'ORDER_SYNC'} ? 'active' : ''">주문 연동</button>
            </form>
        </div>
        <div class="role-description" th:if="${channel.role().name() == 'PRODUCT_SOURCE'}">
            <p class="role-description-title">상품 소스 = 상품을 가져오는 기준 채널</p>
            <p class="role-description-detail">이 채널의 상품이 원재고의 원본이 돼요</p>
        </div>
        <div class="role-description" th:if="${channel.role().name() == 'ORDER_SYNC'}">
            <p class="role-description-title">주문 연동 = 주문·교환·환불만 반영</p>
            <p class="role-description-detail">이 채널의 상품은 원재고에 새로 만들어지지 않아요</p>
        </div>

        <h2 class="section-title">상품 관리</h2>
        <form th:if="${channel.canImportProducts()}" th:action="@{'/channels/' + ${channel.credentialId()} + '/import'}" method="post">
            <button type="submit" class="action-row primary">
                <span class="action-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="19 12 12 19 5 12"></polyline>
                    </svg>
                </span>
                <span class="action-body">
                    <span class="action-title" th:text="'지그재그 상품 불러오기'"></span>
                    <span class="action-detail" th:text="${channel.lastImportedCount() != null} ? ('최근 ' + ${channel.lastImportedCount()} + '개 · ' + ${#temporals.format(channel.lastImportedAt(), 'yyyy-MM-dd HH:mm')}) : '지그재그 상품을 원재고로 가져와요'"></span>
                </span>
            </button>
        </form>

        <div class="action-row disabled">
            <span class="action-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                    <polyline points="21 3 21 9 15 9"></polyline>
                </svg>
            </span>
            <span class="action-body">
                <span class="action-title">주문 자동 동기화</span>
                <span class="action-detail">주문 들어오면 재고 자동 차감</span>
            </span>
            <span class="action-badge">배포 후</span>
        </div>

        <p class="role-footnote">※ 주문 연동으로 바꾸면 상품 불러오기가 사라져요.<br>상품 소스는 1개 채널만 지정할 수 있어요.</p>
    </div>
</body>
</html>
