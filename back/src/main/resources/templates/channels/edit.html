<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('채널 수정')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <h2>채널 수정</h2>
        <form th:action="@{'/channels/' + ${channelId} + '/edit'}" th:object="${form}" method="post">
            <div>
                <label>채널 이름 <input type="text" th:field="*{name}"></label>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>
            <button type="submit">저장</button>
        </form>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
