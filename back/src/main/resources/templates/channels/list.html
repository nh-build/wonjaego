<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('판매 채널 관리')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <h2>판매 채널 관리</h2>

        <p th:if="${error}" th:text="${error}"></p>

        <section>
            <h3>채널 등록</h3>
            <form th:action="@{/channels}" th:object="${form}" method="post">
                <div>
                    <label>채널 이름 <input type="text" th:field="*{name}"></label>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
                <button type="submit">등록</button>
            </form>
        </section>

        <section>
            <h3>채널 목록</h3>
            <table>
                <thead>
                    <tr>
                        <th>채널 이름</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="channel : ${channels}">
                        <td th:text="${channel.name}"></td>
                        <td>
                            <a th:href="@{'/channels/' + ${channel.id} + '/edit'}">수정</a>
                            <form th:action="@{'/channels/' + ${channel.id} + '/delete'}" method="post" style="display:inline">
                                <button type="submit">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
