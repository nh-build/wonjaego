<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>판매채널 - 원재고</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F7FBFE">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="원재고">

    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <th:block th:replace="~{fragments/layout :: tokens}"></th:block>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Pretendard', system-ui, sans-serif;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }

        .page {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }

        .page-subtitle { margin: 16px 2px 20px; font-size: 0.85rem; color: var(--color-text-muted); }

        .channel-cards { display: flex; flex-direction: column; gap: 14px; }

        .channel-card {
            background: var(--color-card); border: 1px solid var(--color-card-border);
            border-radius: 18px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }

        .channel-name { font-weight: 700; font-size: 1.05rem; }

        .channel-card-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .status-dot {
            width: 8px; height: 8px; border-radius: 999px; background: var(--color-card-border); flex-shrink: 0;
        }

        .status-dot.connected { background: var(--color-ok-text); }

        .channel-action-button {
            border: none; border-radius: 999px; padding: 10px 18px; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; white-space: nowrap;
        }

        .channel-action-button.connect { background: var(--color-button-bg); color: var(--color-button-text); }
        .channel-action-button.manage { background: var(--color-tile); color: var(--color-button-text); }

        .channel-action-button.unsupported {
            background: var(--color-tile); color: var(--color-text-muted); cursor: not-allowed;
        }

        .connect-hint {
            margin-top: 20px; background: var(--color-tile); border-radius: 16px; padding: 16px;
        }

        .connect-hint-title { font-weight: 700; font-size: 0.9rem; }
        .connect-hint-detail { margin-top: 4px; font-size: 0.8rem; color: var(--color-text-muted); }
    </style>
</head>
<body class="app-shell">
    <div th:replace="~{fragments/layout :: appTopbar('판매채널', true, false)}"></div>
    <div class="page app-content">
        <p class="page-subtitle">① 채널을 먼저 연동하세요</p>

        <div class="channel-cards">
            <div class="channel-card" th:each="item : ${items}">
                <span class="channel-name" th:text="${item.channelType().label}"></span>
                <div class="channel-card-actions">
                    <span th:if="${item.channelType().integrationSupported}" class="status-dot"
                          th:classappend="${item.connected()} ? 'connected' : ''"></span>
                    <a th:if="${item.channelType().integrationSupported and item.connected()}"
                       th:href="@{'/channels/' + ${item.credentialId()}}"
                       class="channel-action-button manage">관리</a>
                    <a th:if="${item.channelType().integrationSupported and !item.connected()}"
                       href="/channels/connect" class="channel-action-button connect">연동하기</a>
                    <span th:unless="${item.channelType().integrationSupported}"
                          class="channel-action-button unsupported">준비중</span>
                </div>
            </div>
        </div>

        <div class="connect-hint">
            <p class="connect-hint-title">연동 후 관리화면에서 역할을 정해요.</p>
            <p class="connect-hint-detail">상품 소스 / 주문 연동 중 선택</p>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: appTabbar('more')}"></div>
</body>
</html>
