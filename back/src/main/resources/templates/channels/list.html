<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('판매 채널 관리')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="flex-1 container mx-auto max-w-screen-md px-4 py-8">
        <h2 class="text-2xl font-bold mb-6">판매 채널 관리</h2>

        <div th:if="${error}" class="alert alert-error mb-6">
            <span th:text="${error}"></span>
        </div>

        <section class="mb-8">
            <h3 class="text-lg font-semibold mb-3">채널 등록</h3>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body">
                    <form th:action="@{/channels}" th:object="${form}" method="post" class="flex flex-col gap-4 sm:flex-row sm:items-end">
                        <div class="flex flex-col gap-1 flex-1">
                            <label class="label" for="name">채널 이름</label>
                            <input id="name" type="text" th:field="*{name}" class="input input-bordered w-full">
                            <span class="text-error text-sm" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                        </div>
                        <button type="submit" class="btn btn-primary">등록</button>
                    </form>
                </div>
            </div>
        </section>

        <section>
            <h3 class="text-lg font-semibold mb-3">채널 목록</h3>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-4">
                    <div class="overflow-x-auto">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>채널 이름</th>
                                    <th class="text-right">관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="channel : ${channels}">
                                    <td class="font-medium" th:text="${channel.name}"></td>
                                    <td class="text-right">
                                        <div class="flex gap-2 justify-end">
                                            <a th:href="@{'/channels/' + ${channel.id} + '/edit'}" class="btn btn-ghost btn-sm">수정</a>
                                            <form th:action="@{'/channels/' + ${channel.id} + '/delete'}" method="post" class="inline">
                                                <button type="submit" class="btn btn-ghost btn-sm text-error">삭제</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
