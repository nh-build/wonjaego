<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="flex justify-center px-4 py-12">
        <div class="card w-full max-w-sm bg-base-200 shadow-sm">
            <div class="card-body">
                <h2 class="card-title justify-center">로그인</h2>

                <p th:if="${param.error}" class="alert alert-error text-sm py-2">아이디 또는 비밀번호가 올바르지 않습니다.</p>
                <p th:if="${param.registered}" class="alert alert-success text-sm py-2">가입이 완료됐습니다. 로그인해주세요.</p>
                <p th:if="${param.logout}" class="alert alert-info text-sm py-2">로그아웃되었습니다.</p>

                <form th:action="@{/login}" method="post" class="flex flex-col gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="label" for="username">아이디</label>
                        <input id="username" type="text" name="username" class="input input-bordered w-full">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="label" for="password">비밀번호</label>
                        <input id="password" type="password" name="password" class="input input-bordered w-full">
                    </div>
                    <button type="submit" class="btn btn-primary mt-2">로그인</button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
