<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
    <header th:replace="~{fragments/layout :: appbar('로그인', '/')}"></header>

    <main class="flex-1 flex items-center justify-center px-4 pb-8">
        <div class="card w-full max-w-sm bg-base-200 shadow-sm rounded-3xl">
            <div class="card-body items-center gap-4">
                <img src="/images/logo.png" alt="원재고" class="w-40 h-auto">
                <p class="login-tagline -mt-2">All your stock, in ONE</p>

                <div class="w-full">
                    <p th:if="${param.error}" class="alert alert-error text-sm py-2 mb-3">아이디 또는 비밀번호가 올바르지 않습니다.</p>
                    <p th:if="${param.registered}" class="alert alert-success text-sm py-2 mb-3">가입이 완료됐습니다. 로그인해주세요.</p>
                    <p th:if="${param.logout}" class="alert alert-info text-sm py-2 mb-3">로그아웃되었습니다.</p>

                    <form th:action="@{/login}" method="post" class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="label" for="username">아이디</label>
                            <input id="username" type="text" name="username" placeholder="아이디를 입력하세요"
                                   class="input input-bordered rounded-full w-full">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="label" for="password">비밀번호</label>
                            <input id="password" type="password" name="password" placeholder="••••••••"
                                   class="input input-bordered rounded-full w-full">
                        </div>
                        <button type="submit" class="btn btn-primary rounded-full mt-2">로그인</button>
                    </form>

                    <p class="text-center text-sm text-base-content/60 mt-4">
                        아직 회원이 아니신가요? <a href="/signup" class="link link-primary font-medium">회원가입</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <style>
        .login-tagline {
            font-family: Georgia, 'Times New Roman', serif;
            color: #8A97A3;
            letter-spacing: 0.05em;
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</body>
</html>
