<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>홈 - 원재고</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F7FBFE">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <style>
        :root {
            --color-bg: #F7FBFE;
            --color-card: #FFFFFF;
            --color-card-border: #E8EEF4;
            --color-tile: #E4F0FA;
            --color-accent: #D2E7F5;
            --color-button-bg: #C5E1F2;
            --color-button-text: #2B3A45;
            --color-text: #2B3A45;
            --color-text-muted: #8A97A3;
            --color-warn-text: #E29388;
            --color-warn-bg: #F7E3E0;
            --color-ok-text: #5AA06E;
            --color-ok-bg: #E3F1E8;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Pretendard', system-ui, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 24px 20px 96px;
        }

        .top-bar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .top-bar img {
            height: 60px;
            width: auto;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border-radius: 999px;
            background: var(--color-tile);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }

        .tagline {
            margin: 8px 0 24px;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
            color: var(--color-text-muted);
            letter-spacing: 0.05em;
        }

        .summary-tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .tile {
            background: var(--color-tile);
            border-radius: 16px;
            padding: 16px 12px;
        }

        .tile-value {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .tile-value.warn {
            color: var(--color-warn-text);
        }

        .tile-label {
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        .section-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .section-header a {
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .product-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--color-card);
            border: 1px solid var(--color-card-border);
            border-radius: 16px;
            padding: 14px;
        }

        .product-thumb {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: var(--color-tile);
            flex-shrink: 0;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .chip {
            background: var(--color-accent);
            color: var(--color-text);
            font-size: 0.7rem;
            padding: 3px 9px;
            border-radius: 999px;
        }

        .stock-badge {
            flex-shrink: 0;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--color-ok-bg);
            color: var(--color-ok-text);
        }

        .stock-badge.warn {
            background: var(--color-warn-bg);
            color: var(--color-warn-text);
        }

        .empty-state {
            text-align: center;
            color: var(--color-text-muted);
            padding: 32px 0;
            font-size: 0.9rem;
        }

        .action-button {
            display: block;
            width: 100%;
            text-align: center;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-button-text);
            cursor: pointer;
            margin-bottom: 12px;
        }

        .action-button.accent {
            background: var(--color-accent);
        }

        .action-button.primary {
            background: var(--color-button-bg);
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--color-card);
            border-top: 1px solid var(--color-card-border);
            display: flex;
            justify-content: center;
        }

        .tab-bar-inner {
            max-width: 480px;
            width: 100%;
            display: flex;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        .tab-item.active {
            color: var(--color-text);
        }

        .tab-icon {
            width: 20px;
            height: 20px;
            border: 1.5px solid currentColor;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="top-bar">
            <a href="/"><img src="/images/logo.png" alt="원재고"></a>
            <a href="/me" class="icon-button" aria-label="설정">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </a>
        </div>
        <p class="tagline">All your stock, in ONE</p>

        <div class="summary-tiles">
            <div class="tile">
                <div class="tile-value" th:text="${totalProductCount}"></div>
                <div class="tile-label">전체 상품</div>
            </div>
            <div class="tile">
                <div class="tile-value warn" th:text="${lowStockVariantCount}"></div>
                <div class="tile-label">재고 부족</div>
            </div>
            <div class="tile">
                <div class="tile-value warn" th:text="${outOfStockVariantCount}"></div>
                <div class="tile-label">품절</div>
            </div>
        </div>

        <div class="section-header">
            <h2>내 상품</h2>
            <a href="/products">전체보기</a>
        </div>

        <p class="empty-state" th:if="${#lists.isEmpty(productRows)}">등록된 상품이 없습니다.</p>

        <div class="product-list" th:unless="${#lists.isEmpty(productRows)}">
            <a class="product-card" th:each="row : ${productRows}" th:href="@{'/products/' + ${row.id}}">
                <img th:if="${row.hasPhoto}" th:src="@{'/products/' + ${row.id} + '/photo'}" class="product-thumb" alt="">
                <div th:unless="${row.hasPhoto}" class="product-thumb"></div>
                <div class="product-info">
                    <div class="product-name" th:text="${row.name}"></div>
                    <div class="channel-chips" th:if="${!#lists.isEmpty(salesChannels)}">
                        <span class="chip" th:each="channel : ${salesChannels}" th:text="${channel}"></span>
                    </div>
                </div>
                <span class="stock-badge" th:classappend="${row.lowStock} ? 'warn' : ''"
                      th:text="'재고 ' + ${row.totalStock}"></span>
            </a>
        </div>

        <a href="/products" class="action-button accent">✨ AI로 상품명 짓기</a>
        <a href="/products" class="action-button primary">상품 등록</a>
    </div>

    <nav class="tab-bar">
        <div class="tab-bar-inner">
            <a href="/" class="tab-item active">
                <span class="tab-icon"></span>
                홈
            </a>
            <a href="/products" class="tab-item">
                <span class="tab-icon"></span>
                상품
            </a>
            <a href="#" class="tab-item">
                <span class="tab-icon"></span>
                분석
            </a>
            <a href="/me" class="tab-item">
                <span class="tab-icon"></span>
                설정
            </a>
        </div>
    </nav>
</body>
</html>
