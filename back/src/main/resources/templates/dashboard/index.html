<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>홈 - 원재고</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F7FBFE">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <th:block th:replace="~{fragments/layout :: tokens}"></th:block>

    <style>
        :root {
            /* Quick Actions의 "등록/목록" 두 액션 전용 강조색 — 입고/출고는 이미 공유
               good/warn 토큰을 그대로 쓰므로 여기 추가되는 건 이 파랑 하나뿐. */
            --color-action-blue: #4E90C4;
            /* 요약타일 전용 무채색 배경 — 카드(--color-card, 흰색)보다 살짝 짙어 타일임을
               구분하면서도, 색이 있는 --color-tile과 달리 넓은 면에 색을 쓰지 않는다. */
            --color-tile-neutral: #EEF3F7;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Pretendard', system-ui, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* 홈은 appTopbar 프래그먼트를 렌더하지 않으므로, 그 프래그먼트의 <style> 안에만
           정의돼 있는 .app-shell/.app-content 규칙도 여기서 직접 정의해야 앱 셸의
           고정 헤더+스크롤 영역 레이아웃이 유지된다. */
        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        .app-content {
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            padding: 8px 20px 40px;
        }

        .home-header {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 20px 4px;
            background: var(--color-bg);
            box-sizing: border-box;
        }

        .home-header-brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .home-hero-logo {
            height: 96px;
            width: auto;
            object-fit: contain;
        }

        .home-hero-tagline {
            margin: 8px 0 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
            color: var(--color-text-muted);
            letter-spacing: 0.05em;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
            border: none;
            background: none;
            border-radius: 999px;
            color: var(--color-text);
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
        }

        .summary-tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .tile {
            background: var(--color-tile-neutral);
            border: 1px solid var(--color-card-border);
            border-radius: 16px;
            padding: 16px 12px;
        }

        .tile-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .tile-value.warn {
            color: var(--color-warn-text);
        }

        .tile-label {
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        .section-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .section-header h2.eyebrow {
            font-size: 1.05rem;
            letter-spacing: 0.04em;
        }

        .section-header a {
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .quick-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: var(--color-card);
            border: 1px solid var(--color-card-border);
            border-radius: 16px;
            padding: 16px 6px;
            text-align: center;
        }

        .quick-action-icon {
            width: 40px;
            height: 40px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quick-action-icon.blue { background: var(--color-tile); color: var(--color-action-blue); }
        .quick-action-icon.good { background: var(--color-ok-bg); color: var(--color-ok-text); }
        .quick-action-icon.warn { background: var(--color-warn-bg); color: var(--color-warn-text); }

        .quick-action-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-text);
        }

        .low-stock-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }

        .low-stock-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--color-card); border: 1px solid var(--color-card-border);
            border-radius: 16px; padding: 12px 14px;
        }

        .low-stock-thumb {
            width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
            background: var(--color-tile-neutral); object-fit: cover;
            display: flex; align-items: center; justify-content: center; color: var(--color-text-muted);
        }

        .low-stock-name {
            flex: 1; min-width: 0; font-weight: 700; font-size: 0.9rem;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .low-stock-badge {
            flex-shrink: 0; border-radius: 999px; padding: 4px 10px; font-size: 0.78rem; font-weight: 700;
            white-space: nowrap; color: var(--color-warn-text); background: var(--color-warn-bg);
        }

        .low-stock-empty {
            text-align: center; color: var(--color-text-muted); font-size: 0.85rem;
            background: var(--color-card); border: 1px solid var(--color-card-border);
            border-radius: 16px; padding: 24px 0; margin-bottom: 28px;
        }
    </style>
</head>
<body class="app-shell">
    <div class="home-header">
        <div class="home-header-brand">
            <img src="/logo_ver1.png" alt="원재고" class="home-hero-logo">
            <p class="home-hero-tagline">All your stock, in ONE</p>
        </div>
        <a href="/settings" class="icon-btn" aria-label="설정">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </a>
    </div>
    <div class="page app-content">
        <div class="summary-tiles">
            <div class="tile">
                <div class="tile-value" th:text="${totalProductCount}"></div>
                <div class="tile-label">전체 상품</div>
            </div>
            <a href="/products?stock=low" class="tile">
                <div class="tile-value warn" th:text="${lowStockVariantCount}"></div>
                <div class="tile-label">재고 부족</div>
            </a>
            <a href="/products?stock=out" class="tile">
                <div class="tile-value warn" th:text="${outOfStockVariantCount}"></div>
                <div class="tile-label">품절</div>
            </a>
        </div>

        <div class="section-header">
            <h2 class="eyebrow">Quick Actions</h2>
        </div>

        <div class="quick-actions">
            <a href="/products/new" class="quick-action">
                <span class="quick-action-icon blue">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                <span class="quick-action-label">상품 등록</span>
            </a>
            <a href="/movements/stock-in" class="quick-action">
                <span class="quick-action-icon good">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="6 13 12 19 18 13"></polyline>
                    </svg>
                </span>
                <span class="quick-action-label">입고하기</span>
            </a>
            <a href="/movements/stock-out" class="quick-action">
                <span class="quick-action-icon warn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="6 11 12 5 18 11"></polyline>
                    </svg>
                </span>
                <span class="quick-action-label">출고하기</span>
            </a>
            <a href="/products" class="quick-action">
                <span class="quick-action-icon blue">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="9" y1="6" x2="20" y2="6"></line>
                        <line x1="9" y1="12" x2="20" y2="12"></line>
                        <line x1="9" y1="18" x2="20" y2="18"></line>
                        <circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"></circle>
                        <circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"></circle>
                        <circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"></circle>
                    </svg>
                </span>
                <span class="quick-action-label">상품 목록</span>
            </a>
        </div>

        <div class="section-header">
            <h2>재고 확인이 필요해요</h2>
            <a th:if="${!lowStockItems.isEmpty()}" href="/products?stock=low">전체보기</a>
        </div>

        <div class="low-stock-list">
            <a th:each="item : ${lowStockItems}" th:href="@{'/products/' + ${item.id()}}" class="low-stock-row">
                <img th:if="${item.thumbnailUrl() != null}" th:src="${item.thumbnailUrl()}" class="low-stock-thumb" alt="">
                <div th:if="${item.thumbnailUrl() == null}" class="low-stock-thumb">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                        <circle cx="9" cy="9" r="1.5" fill="currentColor" stroke="none"></circle>
                        <polyline points="21 15 15 9 5 19"></polyline>
                    </svg>
                </div>
                <span class="low-stock-name" th:text="${item.name()}"></span>
                <span class="low-stock-badge" th:text="${item.stockLabel()}"></span>
            </a>
            <p th:if="${lowStockItems.isEmpty()}" class="low-stock-empty">재고 부족 상품이 없어요</p>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: appTabbar('home')}"></div>
</body>
</html>
