<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('대시보드')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <h2>대시보드</h2>

        <section>
            <p th:text="'상품 수: ' + ${totalVariantCount} + '개'"></p>
            <p th:text="'총재고 합계: ' + ${totalStockQuantity}"></p>
        </section>

        <section>
            <h3>품절임박 상품</h3>
            <p th:if="${#lists.isEmpty(lowStockVariants)}">품절임박 상품이 없습니다.</p>
            <table th:unless="${#lists.isEmpty(lowStockVariants)}">
                <thead>
                    <tr>
                        <th>상품명</th>
                        <th>SKU</th>
                        <th>총재고</th>
                        <th>품절임박 기준</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="variant : ${lowStockVariants}">
                        <td><a th:href="@{'/products/' + ${variant.product.id}}" th:text="${variant.displayName}"></a></td>
                        <td th:text="${variant.sku}"></td>
                        <td th:text="${variant.stockQuantity}"></td>
                        <td th:text="${variant.effectiveLowStockThreshold}"></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
