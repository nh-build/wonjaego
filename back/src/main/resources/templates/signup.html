<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="flex-1 container mx-auto max-w-screen-md px-4 py-16 flex justify-center">
        <div class="card w-full max-w-sm bg-base-200 shadow-sm">
            <div class="card-body">
                <h2 class="card-title justify-center text-2xl">회원가입</h2>

                <form th:action="@{/signup}" th:object="${form}" method="post" class="flex flex-col gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="label" for="username">아이디</label>
                        <input id="username" type="text" th:field="*{username}" class="input input-bordered w-full">
                        <span class="text-error text-sm" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="label" for="password">비밀번호</label>
                        <input id="password" type="password" th:field="*{password}" class="input input-bordered w-full">
                        <span class="text-error text-sm" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="label" for="businessName">상호명</label>
                        <input id="businessName" type="text" th:field="*{businessName}" class="input input-bordered w-full">
                        <span class="text-error text-sm" th:if="${#fields.hasErrors('businessName')}" th:errors="*{businessName}"></span>
                    </div>
                    <button type="submit" class="btn btn-primary mt-2">가입하기</button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
