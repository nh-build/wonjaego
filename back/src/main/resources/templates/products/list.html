<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('상품 관리')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <h2>상품 관리</h2>

        <p th:if="${error}" th:text="${error}"></p>

        <section>
            <h3>상품 등록</h3>
            <form th:action="@{/products}" th:object="${form}" method="post">
                <div>
                    <label>상품명 <input type="text" th:field="*{name}"></label>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
                <div>
                    <label>SKU <input type="text" th:field="*{sku}"></label>
                    <p th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></p>
                </div>
                <div>
                    <label>가격 <input type="number" step="0.01" th:field="*{price}"></label>
                    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                </div>
                <div>
                    <label>초기 총재고 <input type="number" th:field="*{stockQuantity}"></label>
                    <p th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></p>
                </div>
                <div>
                    <label>품절임박 기준 (선택, 비우면 기본값 5) <input type="number" th:field="*{lowStockThreshold}"></label>
                    <p th:if="${#fields.hasErrors('lowStockThreshold')}" th:errors="*{lowStockThreshold}"></p>
                </div>
                <button type="submit">등록</button>
            </form>
        </section>

        <section>
            <h3>상품 목록</h3>
            <table>
                <thead>
                    <tr>
                        <th>상품명</th>
                        <th>SKU</th>
                        <th>가격</th>
                        <th>총재고</th>
                        <th>품절임박 기준</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td><a th:href="@{'/products/' + ${product.id}}" th:text="${product.name}"></a></td>
                        <td th:text="${product.sku}"></td>
                        <td th:text="${product.price}"></td>
                        <td th:text="${product.stockQuantity}"></td>
                        <td th:text="${product.lowStockThreshold != null} ? ${product.lowStockThreshold} : '기본값(' + ${product.effectiveLowStockThreshold} + ')'"></td>
                        <td>
                            <a th:href="@{'/products/' + ${product.id} + '/edit'}">수정</a>
                            <form th:action="@{'/products/' + ${product.id} + '/delete'}" method="post" style="display:inline">
                                <button type="submit">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
