<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>상품 목록 - 원재고</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F7FBFE">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="원재고">

    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <th:block th:replace="~{fragments/layout :: tokens}"></th:block>

    <style>
        :root {
            /* 채널 배지("쿠팡" 등) 전용 강조색 — 공유 팔레트엔 없는, 이 배지 하나만 쓰는
               별도 액센트라 여기 로컬로 남겨둔다. */
            --color-channel-text: #4A90D9;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Pretendard', system-ui, sans-serif;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }
        .hidden { display: none; }

        .page {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }

        .search-row { margin: 18px 0 12px; }

        .search-input-wrapper {
            display: flex; align-items: center; gap: 8px;
            background: var(--color-card); border: 1px solid var(--color-card-border);
            border-radius: 14px; padding: 0 14px;
        }

        .search-input-wrapper svg { flex-shrink: 0; color: var(--color-text-muted); }

        #search-input {
            border: none; outline: none; flex: 1; padding: 14px 0;
            font-size: 0.95rem; font-family: inherit; background: none; color: var(--color-text);
        }

        .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }

        .filter-chips { display: flex; gap: 8px; }

        .filter-chip {
            border: 1px solid var(--color-card-border); background: var(--color-card);
            border-radius: 999px; padding: 8px 14px; font-size: 0.85rem; font-weight: 600;
            color: var(--color-text-muted); cursor: pointer; white-space: nowrap;
        }

        .filter-chip.active { background: var(--color-button-bg); color: var(--color-button-text); border-color: var(--color-button-bg); }

        #sort-select {
            border: none; background: none; font-size: 0.85rem; font-weight: 600;
            color: var(--color-text-muted); font-family: inherit; cursor: pointer;
        }

        .summary-row {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 0.85rem; margin-bottom: 12px;
        }

        .summary-count { font-weight: 700; }

        .global-error {
            background: var(--color-warn-bg); color: var(--color-warn-text);
            border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 0.85rem;
        }

        #product-cards { display: flex; flex-direction: column; gap: 14px; }

        .product-card {
            display: flex; gap: 14px; width: 100%; text-align: left; cursor: pointer;
            background: var(--color-card); border: 1px solid var(--color-card-border);
            border-radius: 18px; padding: 16px;
        }

        .product-thumb {
            width: 64px; height: 64px; border-radius: 14px; flex-shrink: 0;
            background: var(--color-tile); object-fit: cover;
            display: flex; align-items: center; justify-content: center; color: var(--color-text-muted);
        }

        .product-info { flex: 1; min-width: 0; }

        .product-info-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

        .product-name {
            flex: 1; min-width: 0; font-weight: 700; font-size: 15px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }

        .stock-badge-wrap { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }

        .stock-badge {
            border-radius: 999px; padding: 4px 10px; font-size: 0.78rem; font-weight: 700; white-space: nowrap;
        }

        .stock-badge.ok { color: var(--color-ok-text); background: var(--color-ok-bg); }
        .stock-badge.low, .stock-badge.out { color: var(--color-warn-text); background: var(--color-warn-bg); }

        .stock-warning { font-size: 0.72rem; font-weight: 700; color: var(--color-warn-text); white-space: nowrap; }

        .product-option-summary { margin-top: 4px; font-size: 0.82rem; color: var(--color-text-muted); }

        .product-price { margin-top: 6px; font-size: 1.05rem; font-weight: 800; }

        .product-channel {
            display: inline-block; margin-top: 8px; background: var(--color-tile); color: var(--color-channel-text);
            border-radius: 999px; padding: 3px 10px; font-size: 0.75rem; font-weight: 700;
        }

        .empty-state { text-align: center; padding: 60px 20px; }

        .empty-state-text { margin: 0 0 16px; color: var(--color-text-muted); font-size: 0.9rem; }

        .empty-state-actions { display: flex; flex-direction: column; gap: 10px; max-width: 280px; margin: 0 auto; }

        .empty-state-actions.hidden { display: none; }

        .empty-state-button {
            display: block; border-radius: 14px; padding: 13px; font-size: 0.9rem; font-weight: 700; text-align: center;
        }

        .empty-state-button.primary { background: var(--color-button-bg); color: var(--color-button-text); }
        .empty-state-button.secondary { background: var(--color-card); border: 1px solid var(--color-card-border); color: var(--color-text); }

        #scroll-sentinel {
            text-align: center; color: var(--color-text-muted); font-size: 0.82rem; padding: 18px 0;
        }

    </style>
</head>
<body class="app-shell">
    <div th:replace="~{fragments/layout :: appTopbar('상품 목록', true, false)}"></div>
    <div class="page app-content">
        <div th:if="${error}" class="global-error">
            <span th:text="${error}"></span>
        </div>

        <div class="search-row">
            <div class="search-input-wrapper">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="상품명 검색" autocomplete="off" th:value="${query}">
            </div>
        </div>

        <div class="filter-row">
            <div class="filter-chips">
                <a th:href="@{/products(stock=null, q=${query}, sort=${sort})}" data-stock=""
                   th:class="${stockFilter == 'low' or stockFilter == 'out'} ? 'filter-chip' : 'filter-chip active'">전체</a>
                <a th:href="@{/products(stock='low', q=${query}, sort=${sort})}" data-stock="low"
                   th:class="${stockFilter == 'low'} ? 'filter-chip active' : 'filter-chip'">재고부족</a>
                <a th:href="@{/products(stock='out', q=${query}, sort=${sort})}" data-stock="out"
                   th:class="${stockFilter == 'out'} ? 'filter-chip active' : 'filter-chip'">품절</a>
            </div>
            <select id="sort-select">
                <option value="stock" th:selected="${sort == null or sort == 'stock'}">재고 적은순</option>
                <option value="latest" th:selected="${sort == 'latest'}">최신순</option>
                <option value="name" th:selected="${sort == 'name'}">이름순</option>
            </select>
        </div>

        <div class="summary-row">
            <span class="summary-count"><span th:text="'총 ' + ${page.totalCount()} + '개'"></span></span>
        </div>

        <div id="product-cards">
            <a th:each="item : ${page.items()}" th:href="@{'/products/' + ${item.id()}}" class="product-card">
                <img th:if="${item.thumbnailUrl() != null}" th:src="${item.thumbnailUrl()}" class="product-thumb" alt="">
                <div th:if="${item.thumbnailUrl() == null}" class="product-thumb">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                        <circle cx="9" cy="9" r="1.5" fill="currentColor" stroke="none"></circle>
                        <polyline points="21 15 15 9 5 19"></polyline>
                    </svg>
                </div>
                <div class="product-info">
                    <div class="product-info-top">
                        <span class="product-name" th:text="${item.name()}"></span>
                        <div class="stock-badge-wrap">
                            <span class="stock-badge" th:classappend="${item.stockStyle()}" th:text="${item.stockLabel()}"></span>
                            <span th:if="${item.warningLabel() != null}" class="stock-warning" th:text="${item.warningLabel()}"></span>
                        </div>
                    </div>
                    <p th:if="${!item.optionSummary().isEmpty()}" class="product-option-summary" th:text="${item.optionSummary()}"></p>
                    <p class="product-price" th:text="${item.priceRange()}"></p>
                    <span th:if="${item.channelLabel() != null}" class="product-channel" th:text="${item.channelLabel()}"></span>
                </div>
            </a>
        </div>

        <div id="empty-state" class="empty-state"
             th:with="trueEmpty=${(query == null or #strings.isEmpty(query)) and (stockFilter == null or #strings.isEmpty(stockFilter)) and page.totalCount() == 0}"
             th:classappend="${page.items().isEmpty()} ? '' : 'hidden'">
            <p id="empty-state-text" class="empty-state-text"
               th:text="${trueEmpty} ? '아직 상품이 없어요' : '조건에 맞는 상품이 없어요'"></p>
            <div id="empty-state-actions" class="empty-state-actions" th:classappend="${trueEmpty} ? '' : 'hidden'">
                <a href="/products/new" class="empty-state-button primary">상품 등록하기</a>
                <a href="/channels" class="empty-state-button secondary">채널에서 가져오기</a>
            </div>
        </div>

        <div id="scroll-sentinel" th:classappend="${page.hasNext()} ? '' : 'hidden'">스크롤하면 더 불러와요…</div>
    </div>
    <div th:replace="~{fragments/layout :: appTabbar('products')}"></div>

    <script th:inline="javascript">
        var INITIAL_STOCK_FILTER = /*[[${stockFilter}]]*/ null;
        var INITIAL_SORT = /*[[${sort}]]*/ 'stock';
        var INITIAL_HAS_NEXT = /*[[${page.hasNext()}]]*/ false;
    </script>
    <script th:inline="none">
        (function () {
            var searchInput = document.getElementById('search-input');
            var cardsContainer = document.getElementById('product-cards');
            var sentinel = document.getElementById('scroll-sentinel');
            var emptyState = document.getElementById('empty-state');
            var emptyStateText = document.getElementById('empty-state-text');
            var emptyStateActions = document.getElementById('empty-state-actions');
            var sortSelect = document.getElementById('sort-select');
            if (!searchInput || !cardsContainer || !sentinel) {
                return;
            }

            var currentPage = 0;
            var hasNext = INITIAL_HAS_NEXT;
            var loading = false;
            var debounceTimer = null;

            // Filter chips and the sort select are plain full-page navigations (not JS-driven
            // like search/scroll), so this is the one place their target URL is built — always
            // from the live search box value, never from what q happened to be at page load,
            // so a chip/sort click after typing a search doesn't silently drop it.
            function navigateWithCurrentState(overrides) {
                var url = new URL(window.location.origin + '/products');
                var stock = 'stock' in overrides ? overrides.stock : (INITIAL_STOCK_FILTER || '');
                var sort = overrides.sort || INITIAL_SORT || 'stock';
                var query = searchInput.value.trim();
                if (stock) {
                    url.searchParams.set('stock', stock);
                }
                if (query) {
                    url.searchParams.set('q', query);
                }
                url.searchParams.set('sort', sort);
                window.location.href = url.toString();
            }

            if (sortSelect) {
                sortSelect.addEventListener('change', function () {
                    navigateWithCurrentState({sort: sortSelect.value});
                });
            }

            document.querySelectorAll('.filter-chip').forEach(function (chip) {
                chip.addEventListener('click', function (event) {
                    event.preventDefault();
                    navigateWithCurrentState({stock: chip.getAttribute('data-stock') || ''});
                });
            });

            function stockIconSvg() {
                return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
                    + 'stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3">'
                    + '</rect><circle cx="9" cy="9" r="1.5" fill="currentColor" stroke="none"></circle>'
                    + '<polyline points="21 15 15 9 5 19"></polyline></svg>';
            }

            function buildCard(item) {
                var card = document.createElement('a');
                card.href = '/products/' + item.id;
                card.className = 'product-card';

                if (item.thumbnailUrl) {
                    var img = document.createElement('img');
                    img.className = 'product-thumb';
                    img.src = item.thumbnailUrl;
                    img.alt = '';
                    card.appendChild(img);
                } else {
                    var placeholder = document.createElement('div');
                    placeholder.className = 'product-thumb';
                    placeholder.innerHTML = stockIconSvg();
                    card.appendChild(placeholder);
                }

                var info = document.createElement('div');
                info.className = 'product-info';

                var top = document.createElement('div');
                top.className = 'product-info-top';
                var name = document.createElement('span');
                name.className = 'product-name';
                name.textContent = item.name;
                top.appendChild(name);

                var badgeWrap = document.createElement('div');
                badgeWrap.className = 'stock-badge-wrap';
                var badge = document.createElement('span');
                badge.className = 'stock-badge ' + item.stockStyle;
                badge.textContent = item.stockLabel;
                badgeWrap.appendChild(badge);
                if (item.warningLabel) {
                    var warning = document.createElement('span');
                    warning.className = 'stock-warning';
                    warning.textContent = item.warningLabel;
                    badgeWrap.appendChild(warning);
                }
                top.appendChild(badgeWrap);
                info.appendChild(top);

                if (item.optionSummary) {
                    var optionSummary = document.createElement('p');
                    optionSummary.className = 'product-option-summary';
                    optionSummary.textContent = item.optionSummary;
                    info.appendChild(optionSummary);
                }

                var price = document.createElement('p');
                price.className = 'product-price';
                price.textContent = item.priceRange;
                info.appendChild(price);

                if (item.channelLabel) {
                    var channel = document.createElement('span');
                    channel.className = 'product-channel';
                    channel.textContent = item.channelLabel;
                    info.appendChild(channel);
                }

                card.appendChild(info);
                return card;
            }

            function updateSummary(data) {
                var countEl = document.querySelector('.summary-count');
                if (countEl) {
                    countEl.textContent = '총 ' + data.totalCount + '개';
                }
            }

            // Mirrors the server-side trueEmpty condition (list.html's th:with) so a search
            // that's cleared back to "no query, no filter, still zero products" shows the
            // onboarding buttons again, and a search that merely finds nothing doesn't.
            function updateEmptyState(data) {
                if (!emptyStateText || !emptyStateActions) {
                    return;
                }
                var trueEmpty = !searchInput.value.trim() && !INITIAL_STOCK_FILTER && data.totalCount === 0;
                emptyStateText.textContent = trueEmpty ? '아직 상품이 없어요' : '조건에 맞는 상품이 없어요';
                emptyStateActions.classList.toggle('hidden', !trueEmpty);
            }

            function fetchPage(pageNumber, reset) {
                if (loading) {
                    return;
                }
                loading = true;
                var params = new URLSearchParams();
                if (searchInput.value.trim()) {
                    params.set('q', searchInput.value.trim());
                }
                if (INITIAL_STOCK_FILTER) {
                    params.set('stock', INITIAL_STOCK_FILTER);
                }
                params.set('sort', INITIAL_SORT || 'stock');
                params.set('page', String(pageNumber));

                fetch('/products/list-page?' + params.toString())
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (data) {
                        if (reset) {
                            while (cardsContainer.firstChild) {
                                cardsContainer.removeChild(cardsContainer.firstChild);
                            }
                        }
                        data.items.forEach(function (item) {
                            cardsContainer.appendChild(buildCard(item));
                        });
                        currentPage = pageNumber;
                        hasNext = data.hasNext;
                        sentinel.classList.toggle('hidden', !hasNext);
                        updateSummary(data);
                        if (emptyState) {
                            emptyState.classList.toggle('hidden', cardsContainer.children.length > 0);
                        }
                        updateEmptyState(data);
                    })
                    .finally(function () {
                        loading = false;
                    });
            }

            searchInput.addEventListener('input', function () {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(function () {
                    fetchPage(0, true);
                }, 300);
            });

            // .page 가 곧 앱 셸의 스크롤 컨테이너(.app-content)라서, 뷰포트가 아니라
            // 이 컨테이너를 기준(root)으로 교차를 감지해야 무한 스크롤이 동작한다.
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting && hasNext && !loading) {
                        fetchPage(currentPage + 1, false);
                    }
                });
            }, { root: document.querySelector('.page') });
            observer.observe(sentinel);
        })();
    </script>
</body>
</html>
