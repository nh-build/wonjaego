<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('상품 관리')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="flex-1 container mx-auto max-w-screen-md px-4 py-8">
        <h2 class="text-2xl font-bold mb-6">상품 관리</h2>

        <div th:if="${error}" class="alert alert-error mb-6">
            <span th:text="${error}"></span>
        </div>

        <section class="mb-8">
            <h3 class="text-lg font-semibold mb-3">상품 등록</h3>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body">
                    <form th:action="@{/products}" th:object="${form}" method="post" enctype="multipart/form-data" class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="label" for="name">상품명</label>
                            <input id="name" type="text" th:field="*{name}" class="input input-bordered w-full">
                            <span class="text-error text-sm" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                        </div>

                        <div class="flex flex-col gap-2 border border-base-300 rounded-box p-4">
                            <p class="font-medium text-sm">AI 상품명 추천 (선택)</p>
                            <div class="flex flex-col gap-1">
                                <label class="label" for="name-suggestion-keywords">포인트 단어</label>
                                <input type="text" id="name-suggestion-keywords" placeholder="예: 린넨, 여름, 원피스, 시원한"
                                       class="input input-bordered input-sm w-full">
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="label" for="name-suggestion-mood">컨셉/무드 (선택)</label>
                                <input type="text" id="name-suggestion-mood" placeholder="예: 미니멀하게, 러블리하게"
                                       class="input input-bordered input-sm w-full">
                            </div>
                            <button type="button" id="name-suggestion-button" class="btn btn-outline btn-sm self-start" disabled>
                                이름 생성
                            </button>
                            <p id="name-suggestion-error" class="text-error text-sm hidden"></p>
                            <div id="name-suggestion-results" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="label" for="price">가격</label>
                            <input id="price" type="number" step="0.01" th:field="*{price}" class="input input-bordered w-full">
                            <span class="text-error text-sm" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="label" for="photo">사진 (선택)</label>
                            <input id="photo" type="file" th:field="*{photo}" accept="image/*" capture="environment"
                                   class="file-input file-input-bordered w-full">
                            <span class="text-error text-sm" th:if="${#fields.hasErrors('photo')}" th:errors="*{photo}"></span>
                        </div>

                        <fieldset class="fieldset border border-base-300 rounded-box p-4">
                            <legend class="fieldset-legend px-2">옵션 그룹 (선택, 최대 5개)</legend>
                            <p class="text-sm text-base-content/60 mb-3">값은 콤마로 구분해 입력하세요. 예: 블랙, 화이트</p>
                            <div id="option-rows">
                                <div th:each="i : ${#numbers.sequence(0, maxOptionGroups - 1)}"
                                     th:classappend="${i} > 0 ? 'hidden' : ''"
                                     class="option-row flex gap-2 mb-2">
                                    <input type="text" th:field="*{optionGroups[__${i}__].name}"
                                           placeholder="예: 색상" class="input input-bordered input-sm flex-1 min-w-0">
                                    <input type="text" th:field="*{optionGroups[__${i}__].valuesText}"
                                           placeholder="예: 블랙, 화이트" class="input input-bordered input-sm flex-1 min-w-0">
                                    <button type="button" class="btn btn-ghost btn-sm btn-square shrink-0 option-row-remove"
                                            aria-label="옵션 줄 지우기">✕</button>
                                </div>
                            </div>
                            <button type="button" id="option-add-button" class="btn btn-outline btn-sm mt-1">+ 옵션 추가</button>
                        </fieldset>

                        <button type="submit" class="btn btn-primary mt-2">등록</button>
                    </form>
                </div>
            </div>
        </section>

        <section>
            <h3 class="text-lg font-semibold mb-3">상품 목록</h3>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-4">
                    <div class="overflow-x-auto">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>상품명</th>
                                    <th>가격</th>
                                    <th class="text-right">관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}">
                                    <td>
                                        <img th:if="${product.photoKey != null}" th:src="@{'/products/' + ${product.id} + '/photo'}"
                                             class="w-12 h-12 object-cover rounded-box" alt="">
                                        <div th:unless="${product.photoKey != null}"
                                             class="w-12 h-12 rounded-box bg-base-300 flex items-center justify-center text-base-content/40 text-[10px]">
                                            사진없음
                                        </div>
                                    </td>
                                    <td><a class="link link-hover font-medium" th:href="@{'/products/' + ${product.id}}" th:text="${product.name}"></a></td>
                                    <td th:text="${product.price}"></td>
                                    <td class="text-right">
                                        <div class="flex gap-2 justify-end">
                                            <a th:href="@{'/products/' + ${product.id} + '/edit'}" class="btn btn-ghost btn-sm">수정</a>
                                            <form th:action="@{'/products/' + ${product.id} + '/delete'}" method="post" class="inline">
                                                <button type="submit" class="btn btn-ghost btn-sm text-error">삭제</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script th:inline="none">
        (function () {
            var rows = Array.prototype.slice.call(document.querySelectorAll('#option-rows .option-row'));
            var addButton = document.getElementById('option-add-button');
            if (!addButton || rows.length === 0) {
                return;
            }

            function firstHiddenRow() {
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].classList.contains('hidden')) {
                        return rows[i];
                    }
                }
                return null;
            }

            function updateAddButtonState() {
                addButton.disabled = firstHiddenRow() === null;
            }

            addButton.addEventListener('click', function () {
                var row = firstHiddenRow();
                if (row) {
                    row.classList.remove('hidden');
                }
                updateAddButtonState();
            });

            rows.forEach(function (row, index) {
                var removeButton = row.querySelector('.option-row-remove');
                var inputs = row.querySelectorAll('input');
                removeButton.addEventListener('click', function () {
                    inputs.forEach(function (input) {
                        input.value = '';
                    });
                    // The first row always stays visible — it's the only guaranteed-present
                    // slot; the rest go back into the pool "+" can reveal again.
                    if (index > 0) {
                        row.classList.add('hidden');
                    }
                    updateAddButtonState();
                });
            });

            updateAddButtonState();
        })();
    </script>
    <script th:inline="none">
        (function () {
            var keywordsInput = document.getElementById('name-suggestion-keywords');
            var moodInput = document.getElementById('name-suggestion-mood');
            var suggestButton = document.getElementById('name-suggestion-button');
            var resultsBox = document.getElementById('name-suggestion-results');
            var errorBox = document.getElementById('name-suggestion-error');
            var nameInput = document.getElementById('name');
            var csrfMeta = document.querySelector('meta[name="_csrf"]');
            var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
            if (!keywordsInput || !moodInput || !suggestButton || !resultsBox || !errorBox || !nameInput || !csrfMeta || !csrfHeaderMeta) {
                return;
            }

            var DEFAULT_LABEL = '이름 생성';
            var REGENERATE_LABEL = '다시 생성';
            var hasGenerated = false;

            function updateButtonEnabled() {
                suggestButton.disabled = keywordsInput.value.trim().length === 0;
            }

            function clearResults() {
                while (resultsBox.firstChild) {
                    resultsBox.removeChild(resultsBox.firstChild);
                }
            }

            function showError(message) {
                errorBox.textContent = message;
                errorBox.classList.remove('hidden');
            }

            function hideError() {
                errorBox.classList.add('hidden');
            }

            function buildResultCard(name) {
                var card = document.createElement('button');
                card.type = 'button';
                card.className = 'card bg-base-100 border border-base-300 p-3 text-left hover:border-primary transition-colors font-medium';
                card.textContent = name;
                card.addEventListener('click', function () {
                    nameInput.value = name;
                });
                return card;
            }

            keywordsInput.addEventListener('input', updateButtonEnabled);

            suggestButton.addEventListener('click', function () {
                var keywords = keywordsInput.value.trim();
                if (!keywords) {
                    return;
                }

                suggestButton.disabled = true;
                suggestButton.textContent = '생성 중...';
                hideError();
                clearResults();

                var headers = {'Content-Type': 'application/json'};
                headers[csrfHeaderMeta.getAttribute('content')] = csrfMeta.getAttribute('content');

                fetch('/products/name-suggestions', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({keywords: keywords, mood: moodInput.value.trim()})
                }).then(function (response) {
                    if (!response.ok) {
                        throw new Error('name suggestion request failed');
                    }
                    return response.json();
                }).then(function (names) {
                    names.forEach(function (name) {
                        resultsBox.appendChild(buildResultCard(name));
                    });
                    hasGenerated = true;
                }).catch(function () {
                    showError('상품명을 만드는 데 실패했습니다. 다시 시도해주세요.');
                }).finally(function () {
                    suggestButton.textContent = hasGenerated ? REGENERATE_LABEL : DEFAULT_LABEL;
                    updateButtonEnabled();
                });
            });

            updateButtonEnabled();
        })();
    </script>
</body>
</html>
