<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('상품 관리')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <h2>상품 관리</h2>

        <p th:if="${error}" th:text="${error}"></p>

        <section>
            <h3>상품 등록</h3>
            <form th:action="@{/products}" th:object="${form}" method="post">
                <div>
                    <label>상품명 <input type="text" th:field="*{name}"></label>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
                <div>
                    <label>가격 <input type="number" step="0.01" th:field="*{price}"></label>
                    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                </div>

                <fieldset>
                    <legend>옵션 그룹 (선택, 최대 5개 — 값은 콤마로 구분해 입력, 예: 블랙, 화이트)</legend>
                    <div th:each="i : ${#numbers.sequence(0, maxOptionGroups - 1)}">
                        <label>그룹명 <input type="text" th:field="*{optionGroups[__${i}__].name}" placeholder="예: 색상"></label>
                        <label>값 <input type="text" th:field="*{optionGroups[__${i}__].valuesText}" placeholder="예: 블랙, 화이트"></label>
                    </div>
                </fieldset>

                <button type="submit">등록</button>
            </form>
        </section>

        <section>
            <h3>상품 목록</h3>
            <table>
                <thead>
                    <tr>
                        <th>상품명</th>
                        <th>가격</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td><a th:href="@{'/products/' + ${product.id}}" th:text="${product.name}"></a></td>
                        <td th:text="${product.price}"></td>
                        <td>
                            <a th:href="@{'/products/' + ${product.id} + '/edit'}">수정</a>
                            <form th:action="@{'/products/' + ${product.id} + '/delete'}" method="post" style="display:inline">
                                <button type="submit">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
