<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('변형 수정')}"></head>
<body>
    <header th:replace="~{fragments/layout :: appbar('변형 수정', '/products/' + ${productId})}"></header>

    <main class="flex-1 container mx-auto max-w-screen-md px-4 py-16 flex justify-center">
        <div class="card w-full max-w-sm bg-base-200 shadow-sm">
            <div class="card-body">
                <h2 class="card-title justify-center text-2xl">변형 수정</h2>
                <p class="text-center text-base-content/60 -mt-2 mb-2">
                    옵션: <span class="font-medium text-base-content" th:text="${#strings.isEmpty(variant.optionLabel)} ? ${variant.product.name} : ${variant.optionLabel}"></span>
                </p>

                <form th:action="@{'/products/' + ${productId} + '/variants/' + ${variant.id} + '/edit'}" th:object="${form}" method="post" class="flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="label" for="sku">SKU (선택)</label>
                        <input id="sku" type="text" th:field="*{sku}" class="input input-bordered w-full">
                        <span class="text-error text-sm" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></span>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="label" for="lowStockThreshold">품절임박 기준 (선택, 비우면 기본값 5)</label>
                        <input id="lowStockThreshold" type="number" th:field="*{lowStockThreshold}" class="input input-bordered w-full">
                        <span class="text-error text-sm" th:if="${#fields.hasErrors('lowStockThreshold')}" th:errors="*{lowStockThreshold}"></span>
                    </div>
                    <button type="submit" class="btn btn-primary mt-2">저장</button>
                </form>
                <a th:href="@{'/products/' + ${productId}}" class="btn btn-ghost btn-sm mt-2">상품으로 돌아가기</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
