<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="wonjaego">
<head th:replace="~{fragments/layout :: head('새 비밀번호 설정')}"></head>
<body>
    <main class="flex items-center justify-center min-h-[100dvh] p-6 box-border">
        <div class="card w-full max-w-[360px] bg-base-200 shadow-sm rounded-3xl">
            <div class="card-body items-center gap-4">
                <img src="/logo_ver1.png" alt="원재고" class="w-40 h-auto">
                <p class="login-tagline -mt-2">새 비밀번호 설정</p>

                <div class="w-full" th:if="${invalidToken}">
                    <p class="alert alert-error text-sm py-2 mb-3">
                        재설정 링크가 만료되었거나 잘못됐습니다. 다시 요청해주세요.
                    </p>
                    <p class="text-center text-sm mt-2">
                        <a href="/reset-password" class="link link-primary font-medium">비밀번호 재설정 다시 요청하기</a>
                    </p>
                </div>

                <div class="w-full" th:unless="${invalidToken}">
                    <form th:action="@{/reset-password/confirm}" th:object="${form}" method="post"
                          class="flex flex-col gap-4" id="reset-confirm-form">
                        <input type="hidden" th:field="*{token}">
                        <div class="flex flex-col gap-1">
                            <label class="label" for="newPassword">새 비밀번호</label>
                            <input id="newPassword" type="password" th:field="*{newPassword}" placeholder="••••••••"
                                   class="input input-bordered rounded-full w-full">
                            <span class="text-error text-sm" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="label" for="newPasswordConfirm">새 비밀번호 확인</label>
                            <input id="newPasswordConfirm" type="password" th:field="*{newPasswordConfirm}" placeholder="••••••••"
                                   class="input input-bordered rounded-full w-full">
                            <span class="text-error text-sm" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></span>
                            <span id="password-confirm-error" class="text-error text-sm hidden">비밀번호가 일치하지 않습니다.</span>
                        </div>
                        <button type="submit" class="btn btn-primary rounded-full mt-2">비밀번호 변경</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <style>
        .login-tagline {
            font-family: Georgia, 'Times New Roman', serif;
            color: var(--sub);
            letter-spacing: 0.05em;
            font-size: 0.95rem;
            margin: 0;
        }
    </style>

    <script th:unless="${invalidToken}" th:inline="none">
        (function () {
            var form = document.getElementById('reset-confirm-form');
            var newPassword = document.getElementById('newPassword');
            var confirm = document.getElementById('newPasswordConfirm');
            var error = document.getElementById('password-confirm-error');
            if (!form || !newPassword || !confirm || !error) {
                return;
            }

            form.addEventListener('submit', function (event) {
                if (newPassword.value !== confirm.value) {
                    event.preventDefault();
                    error.classList.remove('hidden');
                    confirm.focus();
                }
            });

            confirm.addEventListener('input', function () {
                error.classList.add('hidden');
            });
        })();
    </script>
</body>
</html>
