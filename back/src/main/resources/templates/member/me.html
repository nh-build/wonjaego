<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 정보 - 원재고</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F7FBFE">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="원재고">

    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <th:block th:replace="~{fragments/layout :: tokens}"></th:block>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Pretendard', system-ui, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 20px 40px;
        }

        .card {
            background: var(--color-card);
            border: 1px solid var(--color-card-border);
            border-radius: 20px;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 999px;
            background: var(--color-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-name {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .badge-seller {
            font-size: 0.7rem;
            background: var(--color-tile);
            color: var(--color-text);
            padding: 2px 8px;
            border-radius: 999px;
        }

        .profile-email {
            color: var(--color-text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .menu-list {
            margin-bottom: 24px;
        }

        .menu-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--color-card-border);
        }

        .menu-row:last-child {
            border-bottom: none;
        }

        .menu-icon {
            width: 20px;
            height: 20px;
            color: var(--color-text-muted);
            flex-shrink: 0;
        }

        .menu-label {
            flex: 1;
            font-size: 0.95rem;
            color: var(--color-text);
        }

        .menu-chevron {
            width: 16px;
            height: 16px;
            color: var(--color-text-muted);
            flex-shrink: 0;
        }

        .withdraw-button {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--color-warn-text);
            background: none;
            color: var(--color-warn-text);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }

        .withdraw-hint {
            text-align: center;
            color: var(--color-text-muted);
            font-size: 0.78rem;
            margin: 10px 0 0;
        }
    </style>
</head>
<body class="app-shell">
    <div th:replace="~{fragments/layout :: appTopbar('내 정보', true, false)}"></div>
    <div class="page app-content">
        <div class="card profile-card">
            <div class="avatar" th:text="${#strings.substring(member.businessName, 0, 1)}"></div>
            <div class="profile-info">
                <div class="profile-name-row">
                    <span class="profile-name" th:text="${member.businessName}"></span>
                    <span class="badge-seller">판매자</span>
                </div>
                <div class="profile-email" th:text="${member.email != null and !member.email.isEmpty()} ? ${member.email} : '이메일 미등록'"></div>
            </div>
        </div>

        <div class="card menu-list">
            <a href="/me/edit" class="menu-row">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
                </svg>
                <span class="menu-label">프로필 수정</span>
                <svg class="menu-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 6 15 12 9 18"></polyline>
                </svg>
            </a>
            <a href="/me/password" class="menu-row">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
                <span class="menu-label">비밀번호 변경</span>
                <svg class="menu-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 6 15 12 9 18"></polyline>
                </svg>
            </a>
        </div>

        <button type="button" class="withdraw-button">회원 탈퇴</button>
        <p class="withdraw-hint">탈퇴 시 모든 상품·재고 데이터가 삭제돼요.</p>
    </div>
    <div th:replace="~{fragments/layout :: appTabbar('more')}"></div>
</body>
</html>
