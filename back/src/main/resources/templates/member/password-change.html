<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 변경')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/layout :: appTopbar('비밀번호 변경', true, false)}"></div>

    <main class="app-content">
        <style>
            html, body { background: var(--color-bg); }

            .page { max-width: 480px; margin: 0 auto; padding: 24px 20px 40px; }

            .field-label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--color-text); margin: 20px 0 6px; }
            .field-label:first-of-type { margin-top: 0; }

            .field-input {
                width: 100%; box-sizing: border-box; border: 1px solid var(--color-card-border); border-radius: 12px;
                padding: 12px 14px; font-family: inherit; font-size: 0.95rem; color: var(--color-text); background: var(--color-card);
            }

            .field-error { display: block; margin-top: 6px; font-size: 0.82rem; color: var(--color-warn-text); }
            .field-error.hidden { display: none; }

            .field-hint { margin-top: 10px; font-size: 0.78rem; color: var(--color-text-muted); }

            .save-button {
                display: block; width: 100%; margin-top: 28px; border: none; border-radius: 14px; padding: 15px;
                background: var(--color-button-bg); color: var(--color-button-text);
                font-weight: 700; font-size: 0.95rem; cursor: pointer; font-family: inherit;
            }
        </style>

        <div class="page">
            <form th:action="@{/me/password}" th:object="${form}" method="post" id="password-form">
                <label class="field-label" for="currentPassword">현재 비밀번호</label>
                <input id="currentPassword" type="password" th:field="*{currentPassword}" class="field-input">
                <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>

                <label class="field-label" for="newPassword">새 비밀번호</label>
                <input id="newPassword" type="password" th:field="*{newPassword}" class="field-input">
                <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>

                <label class="field-label" for="newPasswordConfirm">새 비밀번호 확인</label>
                <input id="newPasswordConfirm" type="password" th:field="*{newPasswordConfirm}" class="field-input">
                <span class="field-error" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></span>
                <span id="password-confirm-error" class="field-error hidden">새 비밀번호가 일치하지 않습니다.</span>

                <p class="field-hint">영문·숫자 조합 6자 이상 권장</p>

                <button type="submit" class="save-button">변경하기</button>
            </form>
        </div>
    </main>
    <div th:replace="~{fragments/layout :: appTabbar('more')}"></div>

    <script th:inline="none">
        (function () {
            var form = document.getElementById('password-form');
            var newPassword = document.getElementById('newPassword');
            var confirm = document.getElementById('newPasswordConfirm');
            var error = document.getElementById('password-confirm-error');
            if (!form || !newPassword || !confirm || !error) {
                return;
            }

            form.addEventListener('submit', function (event) {
                if (newPassword.value !== confirm.value) {
                    event.preventDefault();
                    error.classList.remove('hidden');
                    confirm.focus();
                }
            });

            confirm.addEventListener('input', function () {
                error.classList.add('hidden');
            });
        })();
    </script>
</body>
</html>
