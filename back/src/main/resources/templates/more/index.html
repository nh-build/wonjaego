<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('더보기')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/layout :: appTopbar('더보기', false, false)}"></div>

    <main class="app-content">
        <style>
            html, body { background: var(--color-bg); }

            .page { max-width: 480px; margin: 0 auto; padding: 20px 20px 40px; }

            .profile-card {
                display: flex; align-items: center; gap: 14px; padding: 20px;
                background: var(--color-card); border: 1px solid var(--color-card-border);
                border-radius: 20px; margin-bottom: 20px;
            }

            .avatar {
                width: 56px; height: 56px; border-radius: 999px; background: var(--color-accent);
                display: flex; align-items: center; justify-content: center;
                font-size: 1.3rem; font-weight: 700; flex-shrink: 0; color: var(--color-text);
            }

            .profile-info { flex: 1; min-width: 0; }
            .profile-name { font-weight: 700; font-size: 1.05rem; }
            .profile-username { color: var(--color-text-muted); font-size: 0.85rem; margin-top: 4px; }

            .menu-list {
                background: var(--color-card); border: 1px solid var(--color-card-border);
                border-radius: 20px; overflow: hidden;
            }

            .menu-row {
                display: flex; align-items: center; gap: 12px; padding: 16px 18px;
                border-bottom: 1px solid var(--color-card-border);
                width: 100%; background: none; border-left: none; border-right: none; border-top: none;
                font-family: inherit; text-align: left; cursor: pointer; text-decoration: none; color: var(--color-text);
            }
            .menu-row:last-child { border-bottom: none; }
            .menu-row:disabled, .menu-row.disabled { cursor: default; color: var(--color-text-muted); }

            .menu-label { flex: 1; font-size: 0.95rem; }
            .menu-chevron { width: 16px; height: 16px; color: var(--color-text-muted); flex-shrink: 0; }

            .menu-badge {
                flex-shrink: 0; font-size: 0.72rem; font-weight: 700; color: var(--color-text-muted);
                background: var(--color-tile); border-radius: 999px; padding: 3px 9px;
            }

            .menu-row.logout { color: var(--color-warn-text); font-weight: 700; }
        </style>

        <div class="page">
            <div class="profile-card">
                <div class="avatar" th:text="${#strings.substring(member.businessName, 0, 1)}"></div>
                <div class="profile-info">
                    <div class="profile-name" th:text="${member.businessName}"></div>
                    <div class="profile-username" th:text="${member.username}"></div>
                </div>
            </div>

            <div class="menu-list">
                <a href="/me" class="menu-row">
                    <span class="menu-label">내 정보</span>
                    <svg class="menu-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 6 15 12 9 18"></polyline>
                    </svg>
                </a>
                <a href="/channels" class="menu-row">
                    <span class="menu-label">판매채널 연동</span>
                    <svg class="menu-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 6 15 12 9 18"></polyline>
                    </svg>
                </a>
                <button type="button" class="menu-row disabled" disabled>
                    <span class="menu-label">도움말</span>
                    <span class="menu-badge">준비중</span>
                </button>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="menu-row logout">
                        <span class="menu-label">로그아웃</span>
                    </button>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/layout :: appTabbar('more')}"></div>
</body>
</html>
