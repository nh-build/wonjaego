spring.application.name=wonjaego
spring.profiles.active=dev

spring.jpa.open-in-view=false

# Secure는 프로필별로 명시한다(application-dev.properties/application-prod.yml) — 여기서
# 정하지 않으면 Spring Boot가 request.isSecure()로 암묵적으로 판단하는데, prod의
# forward-headers-strategy=native 때문에 로컬처럼 평문 HTTP인데도 Secure로 잘못 내려가는
# 사고가 날 수 있다(로그인 직후 브라우저가 Secure 쿠키를 버려서 바로 로그아웃된 것처럼 보임).
# SameSite=Lax는 두 환경 모두에서 문제없이 동작하므로 공통으로 고정.
server.servlet.session.cookie.same-site=Lax

# Generous ceiling so an oversized upload reaches the controller and gets our own
# friendly "5MB 이하만" form error, rather than a raw 413 from the multipart resolver.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Empty default so the app boots fine even without GEMINI_API_KEY set — only the
# AI name-suggestion feature itself fails (gracefully) when actually invoked without a key.
wonjaego.ai.gemini.api-key=${GEMINI_API_KEY:}

wonjaego.zigzag.base-url=${ZIGZAG_BASE_URL:https://openapi.zigzag.kr}

# Empty default so the app boots fine without it set — only weakens the derived key for
# channel API credential encryption (com.wonjaego.channel.CredentialEncryptor); set a real
# value in any environment that will actually store real channel credentials.
wonjaego.encryption.key=${WONJAEGO_ENCRYPTION_KEY:}

# Gmail SMTP for 아이디찾기/비밀번호 재설정 이메일. host/port는 고정, 계정만 .env로 받는다 —
# username은 Gmail 주소, password는 일반 로그인 비번이 아니라 Gmail 앱 비밀번호여야 한다.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# SMTP 서버가 응답하지 않을 때 요청 스레드가 무한정 붙잡히지 않도록 — 기본값(무제한)은 위험.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 비밀번호 재설정 메일 안의 링크를 만드는 데 쓰는, 이 앱 자신의 base URL. dev는 로컬 기본값이
# 있지만 prod는 application-prod.yml에서 기본값 없이 필수로 요구한다(잘못된 도메인으로
# 실제 사용자에게 메일이 나가는 사고를 막기 위해).
wonjaego.app.base-url=${APP_BASE_URL:http://localhost:8080}
