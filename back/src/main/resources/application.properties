spring.application.name=wonjaego
spring.profiles.active=dev

spring.jpa.open-in-view=false

# Generous ceiling so an oversized upload reaches the controller and gets our own
# friendly "5MB 이하만" form error, rather than a raw 413 from the multipart resolver.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Empty default so the app boots fine even without ANTHROPIC_API_KEY set — only the
# AI name-suggestion feature itself fails (gracefully) when actually invoked without a key.
wonjaego.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

wonjaego.zigzag.base-url=${ZIGZAG_BASE_URL:https://openapi.zigzag.kr}

# Empty default so the app boots fine without it set — only weakens the derived key for
# channel API credential encryption (com.wonjaego.channel.CredentialEncryptor); set a real
# value in any environment that will actually store real channel credentials.
wonjaego.encryption.key=${WONJAEGO_ENCRYPTION_KEY:}
