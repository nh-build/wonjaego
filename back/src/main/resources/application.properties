spring.application.name=wonjaego
spring.profiles.active=dev

spring.jpa.open-in-view=false

# Generous ceiling so an oversized upload reaches the controller and gets our own
# friendly "5MB 이하만" form error, rather than a raw 413 from the multipart resolver.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
