services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    # No ports: exposed — only the app container reaches it, over the compose-internal
    # network (db:3306). Publishing 3306 to the host isn't needed for the app to work
    # and would expose MySQL to anything that can reach this EC2 instance.

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/wonjaego?serverTimezone=Asia/Seoul
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CHANNEL_ENC_KEY: ${CHANNEL_ENC_KEY}
      APP_UPLOAD_DIR: /app/data/product-photos
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./data/product-photos:/app/data/product-photos
    restart: always

volumes:
  db-data:
